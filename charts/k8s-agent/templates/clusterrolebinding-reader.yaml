apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-agent-reader
  labels:
    {{- include "k8s-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-agent-reader
subjects:
  - kind: ServiceAccount
    name: agent-reader
    namespace: {{ .Release.Namespace }}
