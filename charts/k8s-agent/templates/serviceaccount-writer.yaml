{{- if .Values.writer.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-writer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-agent.labels" . | nindent 4 }}
  {{- with (dig "writer" "annotations" nil .Values.serviceAccount) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
