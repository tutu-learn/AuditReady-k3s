{{- if .Values.writer.enabled }}
# Namespace read access for the writer. Workload management is granted
# cluster-wide via the built-in "admin" ClusterRole (see
# clusterrolebinding-writer.yaml); this role only adds what "admin" does
# not cover: reading Namespace objects themselves, which the operator
# needs to validate deploy targets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-agent-writer
  labels:
    {{- include "k8s-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
{{- end }}
