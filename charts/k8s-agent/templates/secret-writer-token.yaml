{{- if .Values.writer.enabled }}
# Projected serviceAccountToken volumes always issue tokens for the pod's
# own SA (agent-reader) — the projection API has no serviceAccountName
# field. The writer token therefore comes from a classic token Secret,
# mounted into the pod by the kubelet: the writer credential never passes
# through the operator's reader client on the API path. (Note the reader
# role can read Secrets cluster-wide for inventory, so the hard boundary
# of the two-SA split is which credential each subsystem uses by default,
# not API-level secrecy of this token.)
apiVersion: v1
kind: Secret
metadata:
  name: agent-writer-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-agent.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: agent-writer
type: kubernetes.io/service-account-token
{{- end }}
