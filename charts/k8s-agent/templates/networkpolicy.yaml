{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "k8s-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "k8s-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Deny all ingress (metrics scraping must be allowed explicitly if needed).
  ingress: []
  egress:
    # DNS resolution via kube-dns.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # TCP 443 anywhere: the control plane endpoint (external) AND the
    # Kubernetes API server. TCP 6443: pods dial the API via its ClusterIP
    # (:443), but kube-proxy DNATs to the real endpoint, which commonly
    # listens on :6443 (possibly an external IP) — and Calico evaluates
    # egress post-DNAT on this path, so both ports must be allowed.
    # Tighten the control plane leg to specific ipBlock CIDRs if desired.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
{{- end }}
